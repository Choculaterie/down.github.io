<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebooting</title>
    <style>
        @font-face {
            font-family: "Minecraft";
            src: url("fonts/MinecraftRegular-Bmg3.otf") format("opentype");
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #0d1117;
            color: #c9d1d9;
            font-family: "Minecraft", sans-serif;
            display: grid;
            place-items: center;
            text-align: center;
        }

        body {
            padding: 0;
        }

        div {
            padding: 2rem;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            margin: 0 0 1rem;
        }

        p {
            margin: 0;
            color: #8b949e;
            max-width: 32rem;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div>
        <h1>Site rebooting…</h1>
        <p>Restarting the services right now. Please check again in a few minutes.</p>
    </div>
</body>

</html>
